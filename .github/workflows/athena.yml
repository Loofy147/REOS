name: REOS verification

on:
  push:
    branches:
      - main
      - feat/athena-independent-agent-v0.1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[lang,dev]"
      - name: Run unit and integration tests
        run: python -m pytest -q
