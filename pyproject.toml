[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reos"
version = "0.1.0"
description = "Reusable Engineering Orchestration System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["orchestration", "agents", "langgraph", "langsmith", "engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
lang = ["langgraph>=0.2.0", "langsmith>=0.3.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
reos = "reos.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
